services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        ports:
            - "8085:8000"

        volumes:
            - ./:/var/www/html
            - vendor_data:/var/www/html/vendor

        depends_on:
            db:
                condition: service_healthy

            redis:
                condition: service_started

    db:
        image: mysql:8.4

        environment:
            MYSQL_DATABASE: makan_apa
            MYSQL_USER: admin
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: rootpassword

        volumes:
            - mysql_data:/var/lib/mysql

        healthcheck:
            test:
                ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine

        volumes:
            - redis_data:/data

    node:
        image: node:24-alpine

        working_dir: /app

        ports:
            - "5173:5173"

        volumes:
            - ./:/app
            - node_modules:/app/node_modules

        command: npm run dev -- --host 0.0.0.0

volumes:
    mysql_data:
    redis_data:
    node_modules:
    vendor_data:
